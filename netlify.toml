# Réglages Netlify : pré-remplit la construction du site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Mise en cache longue des fichiers générés (leur nom change à chaque version).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
